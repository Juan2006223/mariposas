<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alas de Mariposa — Redirigiendo...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #120924;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 8px 0;
      color: #ffd166;
    }
    p {
      color: #e2d9f3;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    a.btn {
      display: inline-block;
      background: #ff6f91;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 999px;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #ff477e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🦋</div>
    <h1>Alas de Mariposa</h1>
    <p>Cargando la experiencia interactiva modular...</p>
    <a class="btn" href="frontend/index.html">Ingresar a la aplicación</a>
  </div>
  <script>
    window.location.replace('frontend/index.html');
  </script>
</body>
</html>
